    <linearGradient id="doc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0090ED"/>
      <stop offset="1" stop-color="#0250BB"/>
    </linearGradient>
    <linearGradient id="ring" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="16" y2="0">
      <stop offset="0" stop-color="#FFBD4F"/>
