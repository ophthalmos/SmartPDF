  </defs>
  <path fill="url(#doc)" d="M2.5,0.5 H10.5 L14,4 V14.5 a1,1 0 0 1 -1,1 H3 a1,1 0 0 1 -1,-1 V1.5 a1,1 0 0 1 1,-1 Z"/>
