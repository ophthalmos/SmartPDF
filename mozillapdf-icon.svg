<!-- MozillaPDF-Icon (ab 32 px): Blatt in Mozilla-Blau, Band in den Firefox-Verlaufsfarben. Quelle für make-icon.ps1;
     „{js}“ (id="js") blendet das Skript unter 48 px aus. Kleine Größen (16–24 px) kommen aus mozillapdf-icon-small.svg. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="doc" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0090ED"/>
      <stop offset="0.55" stop-color="#0060DF"/>
      <stop offset="1" stop-color="#0250BB"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#80EBFF"/>
      <stop offset="1" stop-color="#00B3F4"/>
    </linearGradient>
    <linearGradient id="ring" gradientUnits="userSpaceOnUse" x1="10" y1="0" x2="246" y2="0">
      <stop offset="0" stop-color="#FFBD4F"/>
      <stop offset="0.35" stop-color="#FF980E"/>
      <stop offset="0.7" stop-color="#FF3750"/>
      <stop offset="1" stop-color="#E31587"/>
    </linearGradient>
    <clipPath id="front"><rect x="-20" y="138" width="300" height="140"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#20123A" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g transform="rotate(-24 128 138)">
    <path id="ringShape" fill="url(#ring)" fill-rule="evenodd"
          d="M10,138 a118,72 0 1,0 236,0 a118,72 0 1,0 -236,0 Z M24,126 a104,58 0 1,0 208,0 a104,58 0 1,0 -208,0 Z"/>
  </g>
  <g filter="url(#shadow)">
    <path fill="url(#doc)" d="M76,22 H158 L204,68 V214 a18,18 0 0 1 -18,18 H76 a18,18 0 0 1 -18,-18 V40 a18,18 0 0 1 18,-18 Z"/>
  </g>
  <path fill="url(#fold)" d="M158,22 V56 a12,12 0 0 0 12,12 H204 Z"/>
  <text x="131" y="146" text-anchor="middle" font-family="Segoe UI" font-weight="700" font-size="66" letter-spacing="-1" fill="#FFFFFF">PDF</text>
  <text id="js" x="178" y="212" text-anchor="middle" font-family="Consolas" font-weight="700" font-size="20" fill="#FFFFFF" fill-opacity="0.9">{js}</text>
  <g transform="rotate(-24 128 138)">
    <path fill="url(#ring)" fill-rule="evenodd" clip-path="url(#front)"
          d="M10,138 a118,72 0 1,0 236,0 a118,72 0 1,0 -236,0 Z M24,126 a104,58 0 1,0 208,0 a104,58 0 1,0 -208,0 Z"/>
  </g>
</svg>
